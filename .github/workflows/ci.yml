name: CI

on:
  push:
    branches: ['claude/**']

jobs:
  # ── Unit tests ───────────────────────────────────────────────────────────────
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  # ── E2E + visual regression tests ────────────────────────────────────────────
  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          # Diff images surface here when a visual regression is detected.
          # Run `npm run test:e2e:update` locally, review diffs, commit new baselines.

  # ── Security audit ───────────────────────────────────────────────────────────
  # Fails on high/critical CVEs in pinned devDependencies that mirror CDN versions.
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm audit --audit-level=high
        # Known: TF.js model packages have peer dep conflicts between themselves.
        # These are audit-only deps (not imported); the audit still catches real CVEs.
        continue-on-error: false

  # ── Deploy to Netlify ─────────────────────────────────────────────────────────
  # Only runs after all tests pass. Netlify auto-deploy must be disabled
  # in the Netlify dashboard (Build & deploy → Continuous deployment → Stop builds).
  deploy:
    needs: [unit-tests, e2e-tests, security-audit]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/claude/')
    steps:
      - uses: actions/checkout@v4
      - run: npx --yes netlify-cli deploy --prod --dir=. --site=${{ secrets.NETLIFY_SITE_ID }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
