<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Face Detection (MediaPipe)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, sans-serif;
      color: #fff;
      overflow: hidden;
    }

    #container {
      position: relative;
      width: 100%;
      max-width: 640px;
    }

    video {
      display: block;
      width: 100%;
      border-radius: 12px;
      /* Mirror the front camera so it feels natural */
      transform: scaleX(-1);
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 12px;
      /* Mirror canvas to match mirrored video */
      transform: scaleX(-1);
    }

    #status {
      margin-top: 16px;
      font-size: 14px;
      color: #aaa;
      text-align: center;
      min-height: 20px;
    }

    #face-count {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div id="container">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div id="face-count">Loading…</div>
</div>
<div id="status">Loading face detection model…</div>

<!-- MediaPipe Tasks Vision (WASM-based, works in-browser without a server install) -->
<script type="module">
  import { FaceDetector, FilesetResolver }
    from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';

  const video     = document.getElementById('video');
  const canvas    = document.getElementById('canvas');
  const ctx       = canvas.getContext('2d');
  const status    = document.getElementById('status');
  const faceCount = document.getElementById('face-count');

  let detector = null;
  let latestDetections = [];

  // ── 1. Start camera ──────────────────────────────────────────────────────────
  async function startCamera() {
    const constraints = {
      video: {
        facingMode: 'user',      // front camera
        width:  { ideal: 1280 },
        height: { ideal: 720 },
      },
      audio: false,
    };

    try {
      const stream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = stream;
      return new Promise(resolve => { video.onloadedmetadata = resolve; });
    } catch (err) {
      const msg = err.name === 'NotAllowedError'
        ? 'Camera permission denied. Please allow camera access and reload.'
        : `Camera error: ${err.message}`;
      status.textContent = msg;
      throw err;
    }
  }

  // ── 2. Load MediaPipe FaceDetector ───────────────────────────────────────────
  async function loadModel() {
    // FilesetResolver fetches the WASM runtime from the same CDN version
    const vision = await FilesetResolver.forVisionTasks(
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
    );

    detector = await FaceDetector.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath:
          'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite',
        delegate: 'GPU',   // uses WebGL on iOS Safari; falls back to CPU automatically
      },
      runningMode: 'VIDEO',
      minDetectionConfidence: 0.5,
    });

    status.textContent = 'Model ready — point at a face!';
  }

  // ── 3. Detection loops ───────────────────────────────────────────────────────
  function syncCanvasSize() {
    if (canvas.width  !== video.videoWidth ||
        canvas.height !== video.videoHeight) {
      canvas.width  = video.videoWidth;
      canvas.height = video.videoHeight;
    }
  }

  function drawBox(detection) {
    const bb   = detection.boundingBox;
    const prob = Math.round(detection.categories[0].score * 100);

    const x = bb.originX;
    const y = bb.originY;
    const w = bb.width;
    const h = bb.height;

    // Bounding box
    ctx.strokeStyle = '#00FF88';
    ctx.lineWidth   = 3;
    ctx.strokeRect(x, y, w, h);

    // Corner accents
    const corner = 16;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth   = 4;
    [[x, y, corner, 0, 0, corner],
     [x+w, y, -corner, 0, 0, corner],
     [x, y+h, corner, 0, 0, -corner],
     [x+w, y+h, -corner, 0, 0, -corner]].forEach(([cx, cy, dx1, dy1, dx2, dy2]) => {
      ctx.beginPath();
      ctx.moveTo(cx + dx1, cy + dy1);
      ctx.lineTo(cx, cy);
      ctx.lineTo(cx + dx2, cy + dy2);
      ctx.stroke();
    });

    // Confidence label
    ctx.fillStyle    = '#00FF88';
    ctx.font         = 'bold 14px -apple-system, sans-serif';
    ctx.textBaseline = 'bottom';
    const label = `Face  ${prob}%`;
    const tw    = ctx.measureText(label).width;
    ctx.fillRect(x - 1, y - 22, tw + 10, 22);
    ctx.fillStyle = '#000';
    ctx.fillText(label, x + 4, y - 4);

    // Keypoints (eyes, nose, mouth, ears)
    if (detection.keypoints) {
      ctx.fillStyle = '#FFD700';
      detection.keypoints.forEach(kp => {
        const kx = kp.x * canvas.width;
        const ky = kp.y * canvas.height;
        ctx.beginPath();
        ctx.arc(kx, ky, 3, 0, Math.PI * 2);
        ctx.fill();
      });
    }
  }

  // Render loop: runs at 60 fps, always draws from the latest detections.
  function renderLoop() {
    syncCanvasSize();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    latestDetections.forEach(drawBox);

    const n = latestDetections.length;
    faceCount.textContent = n === 0 ? 'No face detected'
                          : n === 1 ? '1 face'
                          :           `${n} faces`;

    requestAnimationFrame(renderLoop);
  }

  // Inference loop: feeds video frames to MediaPipe as fast as the model allows.
  async function inferenceLoop() {
    while (true) {
      try {
        if (detector && video.readyState >= 2) {
          const result = detector.detectForVideo(video, performance.now());
          latestDetections = result.detections;
          if (latestDetections.length > 0) status.textContent = '';
        } else {
          await new Promise(r => setTimeout(r, 50));
        }
      } catch (e) {
        console.warn('Inference error, retrying:', e);
        latestDetections = [];
        await new Promise(r => setTimeout(r, 100));
      }
    }
  }

  // ── 4. Boot ──────────────────────────────────────────────────────────────────
  (async () => {
    try {
      await startCamera();
      await loadModel();
      inferenceLoop();  // fire-and-forget; updates latestDetections at model speed
      renderLoop();     // draws latestDetections at 60 fps
    } catch (e) {
      console.error(e);
      status.style.color = '#ff4444';
      status.textContent = `Error: ${e.message || e}`;
    }
  })();
</script>

</body>
</html>
